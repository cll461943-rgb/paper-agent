app:
  name: scholar-agent
  mode: mock          # 可选: mock, live
  output_format: json
  providers:
    - mock
  cache_dir: data/cache
  parallel_retrieval: true

llm:
  enabled: true
  mode: auto
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  base_url: https://api.deepseek.com
  model_flash: deepseek-v4-flash
  model_pro: deepseek-v4-pro
  # 默认降级用 model (若只配置单一 model)
  model: deepseek-v4-flash
  timeout_seconds: 30
  max_tokens: 4096
  temperature: 0.2
  trust_env: true

providers:
  pasa_local:
    enabled: true
    enable_fts: true
    base_url: external/pasa/data/paper_database
    timeout_seconds: 0
    retry_times: 0
    min_interval_seconds: 0.0
    max_concurrency: 1
    backoff_base_seconds: 0.0
  openalex:
    enabled: true
    base_url: https://api.openalex.org/works
    timeout_seconds: 20
    retry_times: 2
    min_interval_seconds: 0.35
    max_concurrency: 1
    backoff_base_seconds: 1.0
    mailto: "33316@example.com"
    api_key_env: OPENALEX_API_KEY
  arxiv:
    enabled: false
    base_url: https://export.arxiv.org/api/query
    timeout_seconds: 15
    retry_times: 2
    min_interval_seconds: 2.0
    max_concurrency: 1
    backoff_base_seconds: 3.0
  semantic_scholar:
    enabled: true
    base_url: https://api.semanticscholar.org/graph/v1/paper/search
    timeout_seconds: 15
    retry_times: 2
    min_interval_seconds: 1.5
    max_concurrency: 1
    backoff_base_seconds: 1.5
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
  pubmed:
    enabled: true
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    timeout_seconds: 20
    retry_times: 2
    min_interval_seconds: 0.35
    max_concurrency: 1
    backoff_base_seconds: 1.0

budget:
  max_search_queries: 10
  max_retrieval_rounds: 2
  max_results_per_query: 30
  max_candidate_pool_size: 400
  max_seed_papers: 5
  max_refchain_depth: 1
  max_llm_selection_papers: 15
  max_final_papers: 10
  max_evidence_summary_papers: 5
  max_llm_calls: 6
  llm_timeout_seconds: 30
  api_timeout_seconds: 8
  retry_times: 1
  known_title_seed_only: false
  enable_query_expansion: true

ranking:
  weights:
    llm_relevance_score: 0.25
    bge_reranker_score: 0.20
    constraint_coverage_score: 0.20
    evidence_completeness_score: 0.15
    source_agreement_score: 0.10
    recency_score: 0.05
    authority_score: 0.03
    diversity_graph_prior_score: 0.02

known_title_clues:
  enabled: false

dynamic_k:
  exact_title_k: 1
  specific_query_k: 2
  dataset_constraint_k: 3
  method_comparison_k: 3
  survey_k: 5
  broad_topic_k: 5
  score_gap_top1: 0.15
  score_gap_top3: 0.10
  min_final_score: 0.55
  fallback_k: 3
