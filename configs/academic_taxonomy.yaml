# Academic Taxonomy for Query Expansion
# Used by query_expansion.py to expand acronyms, find synonyms, and
# generate feedback-based expansion queries.
#
# Structure:
#   acronyms: { ACRONYM: [full forms] }
#   task_synonyms: { term: [synonyms] }
#   method_synonyms: { term: [synonyms] }
#   domain_keywords: { domain: [keywords] }

# ── Acronyms ──────────────────────────────────────────────────────────────
# Map common AI/ML/NLP/CV/Biomedical acronyms to their full forms.
# When a query contains the acronym, the full form is added as an optional term.
acronyms:
  LLM: ["large language model", "large language models"]
  LLMs: ["large language models"]
  NLP: ["natural language processing"]
  CV: ["computer vision"]
  ML: ["machine learning"]
  DL: ["deep learning"]
  RL: ["reinforcement learning"]
  DPO: ["direct preference optimization"]
  PPO: ["proximal policy optimization"]
  RLHF: ["reinforcement learning from human feedback"]
  RAG: ["retrieval-augmented generation", "retrieval augmented generation"]
  MoE: ["mixture of experts"]
  LoRA: ["low-rank adaptation", "low rank adaptation"]
  PEFT: ["parameter-efficient fine-tuning", "parameter efficient fine tuning"]
  SFT: ["supervised fine-tuning", "supervised fine tuning"]
  BERT: ["bidirectional encoder representations from transformers"]
  GPT: ["generative pre-trained transformer", "generative pretrained transformer"]
  TTS: ["text-to-speech", "text to speech"]
  ASR: ["automatic speech recognition"]
  OCR: ["optical character recognition"]
  VLM: ["vision-language model", "vision language model"]
  VQA: ["visual question answering"]
  QA: ["question answering"]
  IR: ["information retrieval"]
  KG: ["knowledge graph"]
  RNN: ["recurrent neural network"]
  CNN: ["convolutional neural network"]
  GAN: ["generative adversarial network"]
  VAE: ["variational autoencoder"]
  CLIP: ["contrastive language-image pre-training"]
  BCI: ["brain-computer interface", "brain computer interface"]
  EEG: ["electroencephalography", "electroencephalogram"]
  fMRI: ["functional magnetic resonance imaging"]
  fNIRS: ["functional near-infrared spectroscopy"]
  MRI: ["magnetic resonance imaging"]
  CT: ["computed tomography"]
  EHR: ["electronic health record", "electronic health records"]
  DNA: ["deoxyribonucleic acid"]
  RNA: ["ribonucleic acid"]
  mRNA: ["messenger RNA"]
  CRISPR: ["clustered regularly interspaced short palindromic repeats"]
  GAN: ["generative adversarial network", "generative adversarial networks"]
  API: ["application programming interface"]
  SOTA: ["state-of-the-art", "state of the art"]
  ZSL: ["zero-shot learning"]
  FSL: ["few-shot learning"]
  OOD: ["out-of-distribution", "out of distribution"]
  ROI: ["region of interest"]
  IoU: ["intersection over union"]
  BLEU: ["bilingual evaluation understudy"]
  ROUGE: ["recall-oriented understudy for gisting evaluation"]
  SGD: ["stochastic gradient descent"]
  Adam: ["adaptive moment estimation"]
  BN: ["batch normalization"]
  LN: ["layer normalization"]
  PE: ["positional encoding"]
  FFN: ["feed-forward network", "feed forward network"]
  MHA: ["multi-head attention", "multi head attention"]
  SA: ["self-attention", "self attention"]
  WM: ["watermark", "watermarking"]

# ── Task Synonyms ─────────────────────────────────────────────────────────
# Map task descriptions to their synonyms. When a query mentions one,
# the others are added as optional terms or used for query2doc expansion.
task_synonyms:
  text generation: ["text synthesis", "language generation", "natural language generation", "NLG"]
  text-to-speech: ["speech synthesis", "TTS", "voice synthesis"]
  speech recognition: ["automatic speech recognition", "ASR", "speech-to-text"]
  image classification: ["image categorization", "visual recognition", "image recognition"]
  object detection: ["object localization", "region detection", "bounding box prediction"]
  image segmentation: ["semantic segmentation", "instance segmentation", "pixel-level classification"]
  machine translation: ["automatic translation", "neural machine translation", "NMT"]
  question answering: ["QA", "reading comprehension", "machine reading"]
  text summarization: ["document summarization", "automatic summarization", "text compression"]
  text classification: ["sentiment analysis", "document classification", "text categorization"]
  named entity recognition: ["NER", "entity extraction", "entity recognition"]
  relation extraction: ["relation classification", "relationship extraction"]
  coreference resolution: ["coreference", "anaphora resolution"]
  text embedding: ["text representation", "sentence embedding", "document embedding"]
  retrieval: ["search", "information retrieval", "document retrieval"]
  ranking: ["relevance ranking", "document ranking", "learning to rank"]
  recommendation: ["recommender system", "recommendation system", "collaborative filtering"]
  anomaly detection: ["outlier detection", "novelty detection"]
  clustering: ["unsupervised clustering", "document clustering", "k-means"]
  data augmentation: ["data generation", "sample augmentation", "training data expansion"]
  model compression: ["model pruning", "knowledge distillation", "model quantization"]
  fine-tuning: ["transfer learning", "adaptation", "domain adaptation"]
  prompt engineering: ["prompt tuning", "instruction tuning", "in-context learning"]
  watermarking: ["watermark", "content watermarking", "model watermarking"]
  protein design: ["protein engineering", "protein structure prediction", "de novo protein design"]
  drug discovery: ["drug design", "molecular generation", "virtual screening"]
  report generation: ["report synthesis", "automatic report generation", "clinical report generation"]

# ── Method Synonyms ───────────────────────────────────────────────────────
# Map method/technique names to their synonyms.
method_synonyms:
  transformer: ["attention-based model", "self-attention network", "Transformer architecture"]
  attention mechanism: ["self-attention", "cross-attention", "multi-head attention"]
  diffusion model: ["denoising diffusion probabilistic model", "DDPM", "score-based generative model"]
  generative adversarial network: ["GAN", "adversarial training", "generator-discriminator"]
  variational autoencoder: ["VAE", "variational inference", "encoder-decoder"]
  contrastive learning: ["contrastive loss", "similarity learning", "metric learning"]
  self-supervised learning: ["pretext learning", "pre-training", "self-supervision"]
  meta-learning: ["learning to learn", "few-shot learning", "task adaptation"]
  graph neural network: ["GNN", "message passing neural network", "graph convolution"]
  reinforcement learning: ["RL", "reward-based learning", "policy gradient"]
  retrieval-augmented generation: ["RAG", "retrieval-augmented", "knowledge-augmented generation"]
  mixture of experts: ["MoE", "expert routing", "conditional computation"]
  low-rank adaptation: ["LoRA", "low-rank update", "parameter-efficient fine-tuning"]
  chain-of-thought: ["CoT", "reasoning chain", "step-by-step reasoning"]
  in-context learning: ["few-shot prompting", "demonstration learning", "prompt-based learning"]
  instruction tuning: ["instruction fine-tuning", "RLHF", "human feedback"]
  distillation: ["knowledge distillation", "teacher-student", "model compression"]
  quantization: ["model quantization", "low-bit inference", "INT8 quantization"]
  pruning: ["model pruning", "sparsity", "structured pruning"]
  scaling law: ["power law", "compute-optimal scaling", "model scaling"]
  test-time training: ["test-time adaptation", "TTT", "online adaptation"]
  vision-language model: ["VLM", "multimodal model", "vision-language pre-training"]
  multimodal: ["multi-modal", "cross-modal", "multimodal learning"]
  autoregressive: ["AR", "next-token prediction", "causal modeling"]
  BERT: ["bidirectional encoder", "masked language model", "MLM"]
  autoregressive model: ["AR model", "causal language model", "left-to-right model"]

